<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocFlow AI — Smart Document & Expense Management</title>
    <meta name="description"
        content="AI-powered receipt reader, email scraper, LINE chatbot, Google Drive & Sheets integration for multi-company expense management.">
    <script>
        // Apply the saved theme before first paint so the page never flashes the wrong one
        (function () {
            var store = {};
            try { store = window.localStorage; } catch (e) { }
            var theme = (store && store.getItem && store.getItem('docflow-skin')) === 'mission-control' ? 'mission-control' : 'default';
            var mode = (store && store.getItem && store.getItem('docflow-theme')) === 'light' ? 'light' : 'dark';
            var root = document.documentElement;
            root.setAttribute('data-theme', theme);
            root.setAttribute('data-mode', mode);
            if (theme === 'mission-control') document.write('<link rel="stylesheet" id="fuiFonts" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Space+Grotesk:wght@400;500&display=swap">');
        })();
    </script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-layout">
        <!-- ─── Sidebar ─── -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <div class="sidebar-logo-icon">📂</div>
                <div class="sidebar-logo-text">Doc<span>Flow</span> AI</div>
            </div>

            <nav class="sidebar-nav" aria-label="Main">
                <div class="sidebar-section-label" data-fui>Workspace</div>
                <button class="nav-item active" data-page="dashboard" onclick="App.navigate('dashboard')">
                    <span class="nav-icon" data-icon="dashboard">📊</span> <span data-fui>Dashboard</span>
                </button>
                <button class="nav-item" data-page="receipts" onclick="App.navigate('receipts')">
                    <span class="nav-icon" data-icon="receipts">🧾</span> <span data-fui>Receipts</span>
                    <span class="nav-badge" id="receiptsBadge" style="display:none">0</span>
                </button>
                <button class="nav-item" data-page="reports" onclick="App.navigate('reports')">
                    <span class="nav-icon" data-icon="reports">📈</span> <span data-fui>Reports</span>
                </button>

                <div class="sidebar-section-label" data-fui>Coming soon</div>
                <button class="nav-item nav-item-soon" data-page="email" onclick="App.navigate('email')">
                    <span class="nav-icon" data-icon="mail">📧</span> <span data-fui>Email intake</span> <span class="nav-soon">Soon</span>
                </button>
                <button class="nav-item nav-item-soon" data-page="line" onclick="App.navigate('line')">
                    <span class="nav-icon" data-icon="chat">💬</span> <span data-fui>LINE bot</span> <span class="nav-soon">Soon</span>
                </button>
                <button class="nav-item nav-item-soon" data-page="drive" onclick="App.navigate('drive')">
                    <span class="nav-icon" data-icon="folder">📁</span> <span data-fui>Google Drive</span> <span class="nav-soon">Soon</span>
                </button>
                <button class="nav-item nav-item-soon" data-page="sheets" onclick="App.navigate('sheets')">
                    <span class="nav-icon" data-icon="sheet">🗂️</span> <span data-fui>Google Sheets</span> <span class="nav-soon">Soon</span>
                </button>
            </nav>

            <div class="sidebar-bottom">
                <button class="nav-item" data-page="settings" onclick="App.navigate('settings')">
                    <span class="nav-icon" data-icon="settings">⚙️</span> <span data-fui>Settings</span>
                </button>
            </div>
        </aside>

        <!-- ─── Topbar ─── -->
        <header class="topbar">
            <button class="btn btn-secondary btn-icon menu-toggle" onclick="App.toggleSidebar()" aria-label="Open menu"
                aria-controls="sidebar" aria-expanded="false" id="menuToggle">☰</button>

            <div class="topbar-title" id="topbarTitle">Dashboard</div>

            <label class="company-switcher" title="Records are saved to this property">
                <span class="company-switcher-label">Property</span>
                <span class="company-dot" id="companyDot"></span>
                <select id="companySwitcher" aria-label="Current property"></select>
            </label>

            <div id="userPanel" style="display:flex;align-items:center;position:relative">
                <!-- User panel injected by app.js -->
            </div>

            <button class="btn btn-secondary btn-icon" id="themeToggle" onclick="App.toggleTheme()" title="Toggle theme" aria-label="Toggle theme"
                style="font-size: 1.1rem; padding: 6px 10px;">
                <span id="themeIcon">🌙</span>
            </button>
        </header>

        <div class="sidebar-backdrop" onclick="App.toggleSidebar(false)"></div>

        <!-- ─── Main Content ─── -->
        <main class="main-content" id="mainContent" style="transition:opacity 0.15s ease">
            <!-- Content is rendered dynamically by app.js -->
            <div style="display:flex;align-items:center;justify-content:center;height:60vh;font-size:2rem">⏳</div>
        </main>
    </div>

    <!-- ─── Toast Container ─── -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ─── Background gradient ─── -->
    <div class="app-bg">
    </div>

    <!-- ─── Scripts (order matters) ─── -->
    <script src="config.js"></script>
    <script src="data/mock-data.js"></script>
    <script src="services/auth.js"></script>
    <script src="services/expenses.js"></script>
    <script src="services/organizations.js"></script>
    <script src="services/receipts.js"></script>
    <script src="services/reports.js"></script>
    <script src="pages/login.js"></script>
    <script src="pages/set-password.js"></script>
    <script src="pages/select-organization.js"></script>
    <script src="pages/dashboard.js"></script>
    <script src="pages/receipts.js"></script>
    <script src="pages/email.js"></script>
    <script src="pages/line.js"></script>
    <script src="pages/drive.js"></script>
    <script src="pages/sheets.js"></script>
    <script src="pages/reports.js"></script>
    <script src="pages/members.js"></script>
    <script src="pages/settings.js"></script>
    <script src="app.js"></script>

</body>

</html>
